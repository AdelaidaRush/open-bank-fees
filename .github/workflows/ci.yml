name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # GitHub-hosted runners build and test the project, which is what they are for
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
